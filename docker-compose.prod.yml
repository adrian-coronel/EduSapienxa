services:
  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: edusapienxa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Angular ─────────────────────────────────────────────
  frontend:
    build:
      context: ./EduSapienxa.Web
      dockerfile: Dockerfile
    container_name: edusapienxa-web
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.edusapienxa-web.rule=Host(`edusapienxa.dludena.digital`)"
      - "traefik.http.routers.edusapienxa-web.entrypoints=websecure"
      - "traefik.http.routers.edusapienxa-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.edusapienxa-web.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy-network"

volumes:
  postgres_data:

networks:
  default:
    external: true
    name: proxy-network
