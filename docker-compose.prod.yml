services:

  # ── Angular ─────────────────────────────────────────────
  frontend:
    build:
      context: ./EduSapienxa.Web
      dockerfile: Dockerfile
    container_name: edusapienxa-web
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.edusapienxa-web.rule=Host(`edusapienxa.dludena.digital`)"
      - "traefik.http.routers.edusapienxa-web.entrypoints=websecure"
      - "traefik.http.routers.edusapienxa-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.edusapienxa-web.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy-network"

networks:
  default:
    external: true
    name: proxy-network
