server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip — reduce JS/CSS hasta 70%
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache agresivo para assets con hash (Angular los genera con fingerprint)
    # main.a3f8c2d1.js → si cambia el código, cambia el nombre → nuevo download
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff2|woff|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — crítico para Angular Router
    # Sin esto: usuario va a /cursos/detalle → Nginx devuelve 404
    # Con esto: Nginx devuelve index.html → Angular maneja la ruta
    location / {
        try_files $uri $uri/ /index.html;
    }
}